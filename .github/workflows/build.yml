name: Build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 0 * * 1"   # weekly rebuild keeps "Updated" dates fresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - name: Test
        run: python tests/test_paycheck.py
      - name: Build
        env:
          # Your domain, e.g. takehomecalc.com. Set under Settings > Secrets and variables > Actions > Variables.
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          SITE_BASE_URL: ${{ vars.CUSTOM_DOMAIN != '' && format('https://{0}/', vars.CUSTOM_DOMAIN) || steps.pages.outputs.base_url }}
        run: python build.py --out public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
